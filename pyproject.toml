[project]
name = "pywavedude"
version = "0.1.0"
description = "Fast cross-platform Python port of WaveDude Next, a 2D wave optics simulator"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = [
    # arrays for every grid, scene and frame
    "numpy>=1.26",
    # JIT-compiled multithreaded (prange) stencil on the CPU, any OS
    "numba>=0.60",
    # scene images: PNG, BMP, JPEG, TIFF, GIF decoding
    "pillow>=10",
    # light GPU-drawn GUI with fast texture updates
    "dearpygui>=2.0",
    # Apple Silicon GPU (Metal) backend; installed only where it can run
    "mlx>=0.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # the defaults file (defaults.yaml), read at start
    "pyyaml>=6.0",
]

[project.scripts]
pywavedude = "pywavedude.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pywavedude"]
