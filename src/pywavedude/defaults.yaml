# PyWaveDude defaults: what a new project, a new object and the app start with.
# Read once at start (another file: --defaults FILE). Every key must name an existing setting.
# A saved project keeps its own values; an attribute a .wdproj file leaves out still means the
# project format's default, not this file's.

app:
  backend: auto                      # compute backend at start: auto | cpu | mlx
  ui:
    window_width: 1600
    window_height: 980
    left_pane_width: 400               # project tree and properties
    tree_pane_height: 330
    probe_graph_column: 440            # width of the probe graph column
    font_size: 15                      # points, Inter
    zoom: 1.0                          # UI zoom at start
    zoom_choices: [0.8, 1.0, 1.25, 1.5, 2.0]
    tree_max_rows: 2000                # rows shown per tree group
    show_probe_graphs: true            # open the probe graph column when a run with probes starts
  canvas:
    pick_radius: 8                     # screen px: how close a click must be to a marker
    snap_radius: 8                     # screen px: how close a centre must come to a grid line
    lever_length: 28                   # screen px beyond the outline: the rotation lever
    wheel: zoom                        # mouse wheel / two-finger scroll: zoom (at the pointer) | pan
                                       #   (pan: Shift scrolls sideways, Ctrl/Cmd + wheel zooms)
    wheel_pan_step: 60                 # screen px per wheel notch when the wheel pans
    zoom_step: 1.2                     # zoom factor per mouse wheel notch
    max_zoom: 32                       # largest canvas zoom (× the fitted view)
  playback:
    speed: 1.0                         # × the export frame rate
    speed_choices: [0.25, 0.5, 1, 2, 4, 8]
    loop: false
    live: false                        # follow the newest frame while a run computes
  run:
    warn_memory: true                  # ask before a run whose frames exceed the budget
    memory_share: 0.5                  # budget: this share of the physical memory
  export:
    file: pywavedude_export            # file name (in the working directory) the dialog starts with
    format: MP4                        # MP4 | MPEG1 | AVI | MOV | MOV_PNG | PNG | JPEG | EXR | EXR_ROOT
    layers: Both                       # Field | Intensity | Both
    outlines: true                     # part outlines in the export

new_project:
  scene:
    width: 1920                         # Width
    height: 1080                        # Height
    refractive_index: 1.0               # Refractive index
    open_edges: true                    # Edges
    damping_edge: -32                   # Damping edge
    image_sources: false                # Image sources
    image_source_scale: 1.0             # Image source amplitude
    object_sources: true                # Object sources
  simulation:
    steps: 2500                         # Steps
    visualize_every: 2                  # Visualize every
    fourth_order: true                  # 4th-order Laplacian
    wave_speed: 1.0                     # Wave speed
    source_frequency_scale: 2.0         # Source frequency scale
    time_decay: 10.0                    # Intensity time decay
    intensity_scale: 1.0                # Intensity scale
    preview: Half                       # Preview resolution
    rerun_on_edit: true                 # Re-run after edits
    split_wavelengths: false            # Separate wavelengths
    preview_frames: 1                   # Preview frames
  display:
    layer: Both                         # Pictures
    arrangement: Stacked                # Arrangement
    handles: true                       # Handles in the preview
    labels: true                        # Labels in the preview
    field_scheme: Default field         # Field colour scheme
    intensity_scheme: Default intensity  # Intensity colour scheme
    field_brightness: 30.0              # Field brightness
    intensity_brightness: 30.0          # Intensity brightness
    field_black: -0.05                  # Field black level
    intensity_black: 0.0                # Intensity black level
    markers: true                       # Markers
    outline: true                       # Outline in the preview
    outline_gain: 3.0                   # Outline brightness
    auto_brightness: false              # Keep auto brightness
    fps: 60                             # Frame rate
    quality: 85                         # Quality
    graphs_in_preview: false             # Graphs on the canvas
    probe_colours: true                 # Probe curves per colour
    grid: false                         # Grid
    grid_step: 50                       # Grid step
    grid_opacity: 0.25                  # Grid opacity
    grid_snap: true                     # Snap to grid
    true_colour: true                   # True colour intensity
    nm_per_px: 0.0                      # nm per px of wavelength
    export_from: 0                      # From step
    export_to: 0                        # To step
    probe_graphs_in_export: true        # Probe graphs in the export
    probe_markers_in_export: true       # Probe markers in the export
    source_markers_in_export: false     # Source markers in the export
  sources:                           # the sources a new project starts with
    - name: Source 1
      x: 480
      y: 540

